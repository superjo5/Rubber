<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>คิดขี้ยาง</title>
<meta name="theme-color" content="#1f8a4c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="คิดขี้ยาง">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#f3f5f2;--card:#fff;--tx:#17211a;--mut:#74807a;--pri:#1f8a4c;--pri2:#16a085;--line:#e4e9e5;--warn:#d64545;--hi:#e7f6ec;--sh:0 2px 10px rgba(20,40,25,.06);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1511;--card:#19221c;--tx:#e8f0ea;--mut:#8b9a90;--pri:#4cc27d;--pri2:#2fbfa5;--line:#26332a;--warn:#ef6b6b;--hi:#1d3226;--sh:none;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px);touch-action:manipulation}
body{margin:0;-webkit-text-size-adjust:100%;background:var(--bg);color:var(--tx);font:16px/1.45 "Sarabun","Noto Sans Thai",system-ui,sans-serif;padding-bottom:88px}
main{padding:14px;max-width:520px;margin:auto}
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:var(--sh);border:1px solid var(--line)}
h2{margin:0 0 8px;font-size:17px;display:flex;align-items:center;gap:8px}
h2 i{font-style:normal;background:var(--hi);width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:16px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,textarea{width:100%;min-width:0;padding:12px 14px;font:inherit;font-size:18px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--tx);outline:0}
input:focus,textarea:focus{border-color:var(--pri)}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;height:50px;max-width:100%;font-size:17px}
input.bad{border-color:var(--warn)}
textarea{font-size:16px;line-height:1.5;height:260px;resize:none}
.row{display:flex;gap:8px;align-items:center;margin-bottom:8px}.row input{flex:1}
.x{border:0;background:var(--hi);color:var(--warn);width:44px;height:44px;border-radius:12px;font-size:18px}
.btn{width:100%;padding:13px;border:0;border-radius:14px;font:inherit;font-weight:700;font-size:16px;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;margin-top:8px}
.btn.o{background:none;border:1.5px solid var(--pri);color:var(--pri)}
.btn.d{background:none;border:1.5px solid var(--warn);color:var(--warn)}
.btn.sm{padding:10px;margin:0;font-size:15px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sum{display:flex;justify-content:space-between;padding:5px 0;color:var(--mut)}.sum b{color:var(--tx)}
.big{display:flex;justify-content:space-between;align-items:center;background:var(--hi);color:var(--pri);padding:12px 14px;border-radius:14px;margin-top:8px;font-weight:700;font-size:19px}
.neg{color:var(--warn)}.warn{color:var(--warn);font-size:14px;margin:6px 0;font-weight:600}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:9}
nav button{flex:1;min-width:0;border:0;background:none;min-height:58px;padding:8px 2px 6px;color:var(--mut);font:inherit;font-size:clamp(11px,3.1vw,13px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
nav button span{font-size:clamp(20px,5.6vw,25px);line-height:1}
nav button em{font-style:normal;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav button.on{color:var(--pri);font-weight:700}
img{width:100%;border-radius:12px;border:1px solid var(--line);display:block}
.hint{font-size:13px;color:var(--mut);margin:6px 0}
.hist{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.hist:first-of-type{border-top:0}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:30;padding:20px}
.ov[hidden]{display:none}
.dlg{background:var(--card);border-radius:20px;padding:22px;width:100%;max-width:340px}
.dlg h3{margin:0 0 6px;font-size:19px}.dlg p{margin:0 0 16px;color:var(--mut);font-size:15px}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:40}
#toast.on{opacity:1}
</style></head><body>
<main><div id="p1"></div><div id="p2" hidden></div><div id="p3" hidden></div><div id="p4" hidden></div><div id="p5" hidden></div></main>
<nav id="nav"></nav><div id="toast"></div>
<div id="md" class="ov" hidden><div class="dlg"><h3>ล้างข้อมูลเริ่มใหม่?</h3><p>น้ำหนัก ราคา และเงินเบิกจะถูกลบ (ชื่อลูกน้องและประวัติยังอยู่)</p><div class="two"><button class="btn o sm" onclick="$('md').hidden=true">ยกเลิก</button><button class="btn d sm" onclick="doReset()">ล้างข้อมูล</button></div></div></div>
<script>
const n0=v=>parseFloat(v)||0;const DEF=["เม่า","เตง"],TD=()=>new Date().toISOString().slice(0,10);
const fresh=(nm,pct)=>({date:TD(),price:"",pct:pct==null?40:pct,names:nm?nm.slice():DEF.slice(),w:[0,1].map(()=>({r:[""],cut:"",adv:""}))});
let S=fresh(),H=[],cur=0,LP=0;try{LP=n0(localStorage.getItem("rb2lp"))}catch(e){}
try{const a=JSON.parse(localStorage.getItem("rb2")||"null");if(a&&a.w&&a.w.length===2){S=a;if(!Array.isArray(S.names)||S.names.length!==2)S.names=DEF.slice()}const h=JSON.parse(localStorage.getItem("rb2h")||"[]");if(Array.isArray(h))H=h}catch(e){}
const sv=()=>{try{localStorage.setItem("rb2",JSON.stringify(S))}catch(e){}};
const svh=()=>{try{localStorage.setItem("rb2h",JSON.stringify(H))}catch(e){}};
const $=id=>document.getElementById(id);
const n=v=>parseFloat(v)||0;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const NM=i=>(S.names[i]||"").trim()||"คนที่ "+(i+1);
const f=v=>v.toLocaleString("th-TH",{minimumFractionDigits:2,maximumFractionDigits:2});
const g=v=>v.toLocaleString("th-TH",{maximumFractionDigits:2});
const dTh=d=>{try{return new Date(d).toLocaleDateString("th-TH",{day:"numeric",month:"short",year:"numeric"})}catch(e){return d}};
const sumR=w=>w.r.reduce((a,b)=>a+n(b),0);
const kgOf=w=>sumR(w)-n(w.cut);
const hasP=()=>n(S.price)>0;
const mo=v=>hasP()?f(v):"—";
function calc(w){const kg=kgOf(w),val=kg*n(S.price),pc=Math.min(100,Math.max(0,n(S.pct))),ws=val*pc/100;if(S.rnd)ws=Math.round(ws);return{kg,val,pc,ws,bs:val-ws,ad:n(w.adv),nt:ws-n(w.adv)}}
function toast(t){const e=$("toast");e.textContent=t;e.className="on";setTimeout(()=>e.className="",1800)}

function navR(){$("nav").innerHTML=[["🧑‍🌾",NM(0)],["🧑‍🌾",NM(1)],["💰","ราคา"],["📤","ส่งต่อ"],["🕘","ประวัติ"]].map((t,i)=>`<button class="${i===cur?"on":""}" onclick="tab(${i})"><span>${t[0]}</span><em>${esc(t[1])}</em></button>`).join("")}
function tab(i){cur=i;for(let k=0;k<5;k++)$("p"+(k+1)).hidden=k!==i;navR();
 if(i<2)rp(i);if(i===2)upd2();if(i===3)r3();if(i===4)r4();scrollTo(0,0)}

// person page
function rp(i){const w=S.w[i];
 $("p"+(i+1)).innerHTML=`<div class="card"><h2><i>✏️</i>ชื่อลูกน้อง</h2><input value="${esc(S.names[i])}" maxlength="20" placeholder="ใส่ชื่อ" oninput="S.names[${i}]=this.value;sv();navR()"></div>
 <div class="card"><h2><i>⚖️</i>ชั่งน้ำหนัก</h2>
 ${w.r.map((v,j)=>`<div class="row"><input type="number" inputmode="decimal" placeholder="รอบที่ ${j+1} (กก.)" value="${v}" oninput="S.w[${i}].r[${j}]=this.value;updP(${i})">${w.r.length>1?`<button class="x" onclick="S.w[${i}].r.splice(${j},1);sv();rp(${i})">✕</button>`:""}</div>`).join("")}
 <button class="btn o" onclick="S.w[${i}].r.push('');sv();rp(${i})">+ เพิ่มรอบชั่ง</button>
 <div class="sum"><span>รวมที่ชั่ง</span><b id="rs${i}"></b></div><label>หักน้ำหนักที่ยังไม่แห้ง (กก.)</label><input type="number" inputmode="decimal" placeholder="0" value="${w.cut}" oninput="S.w[${i}].cut=this.value;updP(${i})">
 <div class="big"><span>น้ำหนักสุทธิ</span><span id="kg${i}"></span></div></div>
 <div class="card"><h2><i>💰</i>คิดเงิน</h2><div id="ph${i}" class="warn"></div>
 <div class="sum"><span>มูลค่ารวม</span><b id="v${i}"></b></div>
 <div class="sum"><span id="sl${i}"></span><b id="s${i}"></b></div>
 <label>หักเงินเบิก (บาท)</label><input type="number" inputmode="decimal" placeholder="0" value="${w.adv}" oninput="S.w[${i}].adv=this.value;updP(${i})">
 <div class="big"><span>ได้สุทธิ</span><span id="t${i}"></span></div>
 <div class="sum"><span id="bl${i}"></span><b id="b${i}"></b></div></div>
 <button class="btn d" onclick="$('md').hidden=false">ล้างข้อมูลเริ่มใหม่</button>`;updP(i,1)}
function updP(i,ns){const c=calc(S.w[i]);$("kg"+i).textContent=g(c.kg)+" กก.";$("rs"+i).textContent=g(sumR(S.w[i]))+" กก.";$("ph"+i).textContent=hasP()?"":"⚠️ ยังไม่ได้ใส่ราคา (ไปที่แท็บ ราคา)";
 $("v"+i).textContent=mo(c.val);$("sl"+i).textContent="ส่วนแบ่ง "+g(c.pc)+"%";$("s"+i).textContent=mo(c.ws);
 const t=$("t"+i);t.textContent=mo(c.nt);t.className=hasP()&&c.nt<0?"neg":"";$("bl"+i).textContent="ส่วนเถ้าแก่ "+g(100-c.pc)+"%";$("b"+i).textContent=mo(c.bs);sv()}

// price page
function build2(){
 $("p3").innerHTML=`<div class="card"><h2><i>💰</i>ราคาและสัดส่วน</h2>
 <label>วันที่</label><input id="date" type="date" value="${S.date}" oninput="S.date=this.value;sv()">
 <label>ราคา (บาท/กก.)</label><input id="price" type="number" inputmode="decimal" placeholder="ใส่ราคาวันนี้" value="${S.price}" oninput="S.price=this.value;upd2()">
 <div id="pw" class="warn"></div>
 <label>ลูกน้องได้ (%)</label><input id="pct" type="number" inputmode="decimal" value="${S.pct}" oninput="S.pct=this.value;upd2()">
 <div class="two" style="margin-top:10px"><button class="btn o sm" onclick="setPct(40)">40 : 60</button><button class="btn o sm" onclick="setPct(50)">50 : 50</button></div><label style="display:flex;gap:10px;align-items:center;color:var(--tx);font-size:15px;margin-top:14px"><input type="checkbox" style="width:22px;height:22px" ${S.rnd?"checked":""} onchange="S.rnd=this.checked;upd2()">ปัดส่วนลูกน้องเป็นบาทเต็ม</label></div>`+
 [0,1].map(i=>`<div class="card"><h2><i>🧑‍🌾</i><span id="nm${i}"></span></h2>
 <div class="sum"><span>น้ำหนักสุทธิ</span><b id="k${i}"></b></div>
 <div class="sum"><span>มูลค่ารวม</span><b id="v2${i}"></b></div>
 <div class="sum"><span id="sl2${i}"></span><b id="s2${i}"></b></div>
 <div class="sum"><span>หักเงินเบิก</span><b id="a${i}"></b></div>
 <div class="big"><span>ได้สุทธิ</span><span id="t2${i}"></span></div>
 <div class="sum"><span id="bl2${i}"></span><b id="b2${i}"></b></div></div>`).join("")+
 `<div class="card"><h2><i>📊</i>สรุปรวม</h2><div class="sum"><span>น้ำหนักรวม</span><b id="tk"></b></div>
 <div class="big"><span>เถ้าแก่ได้</span><span id="tb"></span></div><div class="big"><span>ลูกน้องรวมสุทธิ</span><span id="tw"></span></div>
 <button class="btn" onclick="tab(3)">ไปหน้าส่งต่อ ➜</button></div>
 <button class="btn d" onclick="$('md').hidden=false">ล้างข้อมูลเริ่มใหม่</button>`}
function setPct(v){S.pct=v;$("pct").value=v;upd2()}
function upd2(){let tk=0,tb=0,tw=0;
 $("price").className=hasP()?"":"bad";$("pw").innerHTML=hasP()?"":"⚠️ ยังไม่ได้ใส่ราคา"+(LP?` <button class="btn o sm" style="display:inline;width:auto;padding:4px 12px;margin-left:6px" onclick="useLP()">ใช้ราคาล่าสุด ${g(LP)}</button>`:"");
 S.w.forEach((w,i)=>{const c=calc(w);tk+=c.kg;tb+=c.bs;tw+=c.nt;
  $("nm"+i).textContent=NM(i);$("k"+i).textContent=g(c.kg)+" กก.";$("v2"+i).textContent=mo(c.val);$("sl2"+i).textContent="ส่วนแบ่ง "+g(c.pc)+"%";$("s2"+i).textContent=mo(c.ws);
  $("a"+i).textContent=f(c.ad);const t=$("t2"+i);t.textContent=mo(c.nt);t.className=hasP()&&c.nt<0?"neg":"";$("bl2"+i).textContent="ส่วนเถ้าแก่ "+g(100-c.pc)+"%";$("b2"+i).textContent=mo(c.bs)});
 $("tk").textContent=g(tk)+" กก.";$("tb").textContent=mo(tb);$("tw").textContent=mo(tw);sv()}
function setLP(v){if(n(v)>0){LP=n(v);try{localStorage.setItem("rb2lp",LP)}catch(e){}}}
function useLP(){S.price=String(LP);$("price").value=LP;upd2()}
function resetKeep(){const k=S.rnd;setLP(S.price);S=fresh(S.names,S.pct);S.rnd=k;sv();build2()}
function doReset(){resetKeep();$("md").hidden=true;tab(cur);toast("ล้างข้อมูลแล้ว")}
function newRound(){saveH();resetKeep();tab(0);toast("บันทึกแล้ว เริ่มรอบใหม่")}

// export
function lines(){
 const pr=n(S.price),pc=Math.min(100,Math.max(0,n(S.pct))),L=[];let tb=0,tw=0,tk=0;
 L.push({t:"สรุปขายขี้ยาง "+dTh(S.date),s:"h"});
 L.push({t:`ราคา ${f(pr)} บาท/กก. | ลูกน้อง ${g(pc)}% : เถ้าแก่ ${g(100-pc)}%`,s:"g"});
 S.w.forEach((w,i)=>{const rs=w.r.filter(x=>x!=="").map(n),c=calc(w);tb+=c.bs;tw+=c.nt;tk+=c.kg;
  L.push({t:"",s:"n"});L.push({t:"● "+NM(i),s:"b"});
  L.push({t:`1) ชั่ง ${rs.length>1?rs.map(g).join(" + ")+" = "+g(sumR(w)):g(sumR(w))} กก.`,s:"n"});
  if(n(w.cut))L.push({t:`2) หักชื้น ${g(n(w.cut))} → เหลือ ${g(c.kg)} กก.`,s:"n"});
  L.push({t:`3) ${g(c.kg)} × ${f(pr)} = ${f(c.val)} บาท`,s:"n"});
  L.push({t:`4) ลูกน้อง ${g(pc)}% = ${f(c.ws)} บาท`,s:"n"});
  if(c.ad)L.push({t:`5) หักเงินเบิก ${f(c.ad)} บาท`,s:"n"});
  L.push({t:`➜ ${NM(i)} ได้สุทธิ ${f(c.nt)} บาท`,s:"b"});
  L.push({t:`   (เถ้าแก่ ${g(100-pc)}% = ${f(c.bs)} บาท)`,s:"g"})});
 L.push({t:"",s:"n"});L.push({t:`รวม ${g(tk)} กก.`,s:"n"});
 L.push({t:`เถ้าแก่ได้ ${f(tb)} บาท`,s:"b"});L.push({t:`ลูกน้องรวมสุทธิ ${f(tw)} บาท`,s:"b"});return L}
const txt=()=>lines().map(l=>l.t).join("\n");
function cv(L){const W2=720,LH=38,H2=100+L.length*LH+24,c=document.createElement("canvas");c.width=W2*2;c.height=H2*2;const x=c.getContext("2d");x.scale(2,2);
 x.fillStyle="#fff";x.fillRect(0,0,W2,H2);const gr=x.createLinearGradient(0,0,W2,0);gr.addColorStop(0,"#1f8a4c");gr.addColorStop(1,"#16a085");x.fillStyle=gr;x.fillRect(0,0,W2,70);
 const ff='"Sarabun","Noto Sans Thai",sans-serif';x.fillStyle="#fff";x.font="bold 30px "+ff;x.fillText(L[0].t,24,46);
 L.slice(1).forEach((l,k)=>{const y=70+36+k*LH;x.font=(l.s==="b"?"bold 26px ":"24px ")+ff;x.fillStyle=l.s==="g"?"#6b776b":l.s==="b"?"#1f8a4c":"#17211a";x.fillText(l.t,24,y)});
 return c}
const img=L=>cv(L).toDataURL("image/png");
function shImg(){cv(lines()).toBlob(async b=>{try{const f=new File([b],"ขี้ยาง-"+S.date+".png",{type:"image/png"});if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f]});else toast("กดค้างที่รูปเพื่อบันทึก")}catch(e){}})}
function r3(){const L=lines();
 $("p4").innerHTML=(hasP()?"":`<div class="card"><div class="warn" style="margin:0">⚠️ ยังไม่ได้ใส่ราคา — ไปแท็บ "ราคา" ก่อนส่ง</div></div>`)+`<div class="card"><h2><i>🖼️</i>รูปสรุป</h2><img id="im" alt="สรุป"><div class="hint">กดค้างที่รูป → บันทึก/คัดลอก แล้วส่งเข้าไลน์</div></div>
 <div class="card"><h2><i>📝</i>ข้อความ + วิธีคิด</h2><textarea id="tx" readonly>${esc(txt())}</textarea>
 <button class="btn" onclick="shImg()">🖼️ แชร์รูปเข้าไลน์</button><button class="btn o" onclick="cp()">คัดลอกข้อความ</button><button class="btn o" onclick="sh()">แชร์ไปไลน์/แอปอื่น</button>
 <button class="btn o" onclick="saveH()">💾 บันทึกลงประวัติ</button><button class="btn o" onclick="newRound()">✅ บันทึก + เริ่มรอบใหม่</button></div>`;
 try{$("im").src=img(L)}catch(e){}}
function cp(){const t=$("tx");t.focus();t.select();let ok=false;
 try{navigator.clipboard.writeText(txt()).then(()=>toast("คัดลอกแล้ว"),()=>{try{document.execCommand("copy")&&toast("คัดลอกแล้ว")}catch(e){}});ok=true}catch(e){}
 if(!ok){try{document.execCommand("copy");toast("คัดลอกแล้ว")}catch(e){toast("กดค้างที่ข้อความเพื่อคัดลอก")}}}
async function sh(){try{await navigator.share({text:txt()})}catch(e){cp()}}
function saveH(){let tb=0;const nets=S.w.map(w=>{const c=calc(w);tb+=c.bs;return c.nt});setLP(S.price);
 H.unshift({id:Date.now(),date:S.date,tb,nets,price:S.price,s:JSON.parse(JSON.stringify(S))});H=H.slice(0,100);svh();toast("บันทึกแล้ว")}
function r4(){$("p5").innerHTML=`<div class="card"><h2><i>🕘</i>ประวัติ</h2>`+(H.length?H.map(h=>`<div class="hist"><div><b>${dTh(h.date)}</b><div class="hint" style="margin:0">ราคา ${g(n(h.price))} | ${esc((h.s.names||DEF).map((x,k)=>x+" "+(h.nets?f(h.nets[k]):"")).join(" | "))}</div></div><div class="two"><button class="btn o sm" onclick="ld(${h.id})">เปิด</button><button class="btn d sm" onclick="dl(${h.id})">ลบ</button></div></div>`).join(""):`<div class="hint">ยังไม่มีรายการ — บันทึกจากหน้า "ส่งต่อ"</div>`)+`</div>
 <div class="card"><h2><i>🛟</i>สำรอง / กู้คืนข้อมูล</h2><div class="hint">คัดลอกเก็บไว้ (เช่น ส่งเข้าไลน์ตัวเอง) แล้ววางกู้คืนเมื่อเปลี่ยนเครื่อง</div>
 <textarea id="bk" style="height:90px" placeholder="วางข้อมูลสำรองที่นี่"></textarea><div class="two" style="margin-top:8px"><button class="btn o sm" onclick="backup()">คัดลอกสำรอง</button><button class="btn o sm" onclick="restore()">กู้คืน</button></div></div>`}
function backup(){const t=JSON.stringify({v:2,S,H}),e=$("bk");e.value=t;e.focus();e.select();try{navigator.clipboard.writeText(t).then(()=>toast("คัดลอกข้อมูลสำรองแล้ว"),()=>{try{document.execCommand("copy");toast("คัดลอกแล้ว")}catch(x){}})}catch(x){try{document.execCommand("copy");toast("คัดลอกแล้ว")}catch(y){}}}
function restore(){try{const o=JSON.parse($("bk").value);if(o&&o.S&&o.S.w&&o.S.w.length===2){S=o.S;if(!Array.isArray(S.names)||S.names.length!==2)S.names=DEF.slice();if(Array.isArray(o.H))H=o.H;sv();svh();build2();r4();toast("กู้คืนแล้ว")}else toast("ข้อมูลไม่ถูกต้อง")}catch(e){toast("ข้อมูลไม่ถูกต้อง")}}
function ld(id){const h=H.find(x=>x.id===id);if(h){S=JSON.parse(JSON.stringify(h.s));if(!Array.isArray(S.names)||S.names.length!==2)S.names=DEF.slice();sv();build2();tab(2);toast("เปิดรายการแล้ว")}}
function dl(id){H=H.filter(x=>x.id!==id);svh();r4()}
build2();tab(0);
try{if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
</script></body></html>
