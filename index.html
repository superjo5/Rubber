<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>คิดขี้ยาง</title>
<meta name="theme-color" content="#1f8a4c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="คิดขี้ยาง">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#f4f2ee;--card:#fffdf9;--tx:#2b2b28;--mut:#6e6a62;--pri:#2f7d57;--hi:#e6f0e9;--line:#e6e1d8;--warn:#b84a4a;--sh:0 2px 8px rgba(60,50,30,.06);--fa:#2f7d57;--fb:#418f6b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px);touch-action:manipulation}
body{margin:0;-webkit-text-size-adjust:100%;background:var(--bg);color:var(--tx);font:17px/1.5 "Sarabun","Noto Sans Thai",system-ui,sans-serif;padding-bottom:92px}
main{padding:14px;max-width:520px;margin:auto}
.top{display:flex;justify-content:space-between;align-items:center;padding:2px 2px 12px}.top b{font-size:20px}
.top button{border:1.5px solid var(--line);background:var(--card);color:var(--tx);border-radius:20px;padding:8px 14px;font:inherit;font-size:14px}
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:var(--sh);border:1px solid var(--line)}
h2{margin:0 0 8px;font-size:18px;display:flex;align-items:center;gap:8px}
h2 i{font-style:normal;background:var(--hi);width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-size:17px}
label{display:block;font-size:14px;color:var(--mut);margin:10px 0 4px}
input,textarea{width:100%;min-width:0;padding:12px 14px;font:inherit;font-size:19px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--tx);outline:0}
input:focus,textarea:focus{border-color:var(--pri)}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;height:52px;max-width:100%;font-size:18px}
input.bad{border-color:var(--warn)}
textarea{font-size:16px;line-height:1.5;height:260px;resize:none}
.row{display:flex;gap:8px;align-items:center;margin-bottom:8px}.row input{flex:1}
.x{border:0;background:var(--hi);color:var(--warn);width:46px;height:46px;border-radius:12px;font-size:18px;flex:none}
.btn{width:100%;padding:14px;border:0;border-radius:14px;font:inherit;font-weight:700;font-size:17px;background:linear-gradient(135deg,var(--fa),var(--fb));color:#fff;margin-top:8px}
.btn.o{background:none;border:1.5px solid var(--pri);color:var(--pri)}
.btn.d{background:none;border:1.5px solid var(--warn);color:var(--warn)}
.btn.sm{padding:11px;margin:0;font-size:15px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sum{display:flex;justify-content:space-between;padding:5px 0;color:var(--mut)}.sum b{color:var(--tx)}
.big{display:flex;justify-content:space-between;align-items:center;background:var(--hi);color:var(--pri);padding:12px 14px;border-radius:14px;margin-top:8px;font-weight:700;font-size:20px}
.neg{color:var(--warn)}.warn{color:var(--warn);font-size:15px;margin:6px 0;font-weight:600}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.pbtn{display:flex;align-items:center;gap:10px;text-align:left;border:2.5px solid var(--cc,var(--pri));background:var(--card);color:var(--tx);border-radius:18px;padding:12px;font:inherit;min-width:0}
.pbtn .pa{font-size:28px;flex:none}.pbtn div{min-width:0}
.pbtn b{display:block;font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pbtn small{display:block;font-size:14px;color:var(--mut)}
.pbtn.on{background:var(--cc);color:#fff}.pbtn.on small{color:rgba(255,255,255,.9)}
.pbtn.add{border-style:dashed;--cc:var(--mut);color:var(--mut);justify-content:center;font-weight:700;font-size:17px}
.hero{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,var(--fa),var(--fb));color:#fff;border-radius:18px;padding:14px 16px;margin-bottom:12px}
.hero small{display:block;opacity:.88;font-size:13px}.hero b{display:block;font-size:21px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{font-size:30px;background:rgba(255,255,255,.22);width:52px;height:52px;border-radius:16px;display:grid;place-items:center;flex:none}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:9}
nav button{position:relative;flex:1;min-width:0;border:0;background:none;min-height:60px;padding:8px 2px 6px;color:var(--mut);font:inherit;font-size:clamp(12px,3.4vw,14px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
nav button span{font-size:clamp(21px,6vw,26px);line-height:1}
nav button em{font-style:normal;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav button.on{color:var(--ac,var(--pri));font-weight:700}
nav button.on::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--ac,var(--pri))}
img{width:100%;border-radius:12px;border:1px solid var(--line);display:block}
.hint{font-size:14px;color:var(--mut);margin:6px 0}
.hist{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.hist:first-of-type{border-top:0}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:30;padding:20px}
.ov[hidden]{display:none}
.dlg{background:var(--card);border-radius:20px;padding:22px;width:100%;max-width:340px}
.dlg h3{margin:0 0 6px;font-size:20px}.dlg p{margin:0 0 16px;color:var(--mut);font-size:16px}
#toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);background:#333;color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:40}
#toast.on{opacity:1}
</style></head><body>
<main><div class="top"><b>⚖️ คิดขี้ยาง</b><button id="thb" onclick="cyc()"></button></div>
<div id="p1"></div><div id="p2" hidden></div><div id="p3" hidden></div><div id="p4" hidden></div></main>
<nav id="nav"></nav><div id="toast"></div>
<div id="md" class="ov" hidden><div class="dlg"><h3 id="mt"></h3><p id="mm"></p><div class="two"><button class="btn o sm" onclick="$('md').hidden=true">ยกเลิก</button><button id="mo" class="btn d sm" onclick="$('md').hidden=true;okFn&&okFn()">ตกลง</button></div></div></div>
<script>
// ---- theme & palette ----
const PL=[["#6c5c9c","#ece9f4","#8271b0"],["#3f6ba8","#e6edf6","#5782bd"],["#2f7d76","#e2f0ee","#46928a"],["#a0525f","#f5e6e9","#b66a77"],["#6b7a2e","#eef0de","#829240"],["#a8613a","#f3e9e1","#b9744b"]];
const PD=[["#bcb0e0","#2b2739"],["#9dbbe6","#202c3c"],["#86cbc3","#1e3633"],["#e3a3ae","#3b262b"],["#c3cf84","#2e3220"],["#e0ab85","#3a2e24"]];
const AV=["🧑‍🌾","👷","🧑‍🔧","🧔","👩‍🌾","🧑"];
let lv="",dk="--bg:#16181a;--card:#202325;--tx:#e8e6e1;--mut:#9b9a94;--pri:#86c9a1;--hi:#24342b;--line:#2e3234;--warn:#e69090;--sh:none;color-scheme:dark;",cl="";
PL.forEach((p,k)=>{lv+=`--c${k}:${p[0]};--h${k}:${p[1]};--f${k}:${p[0]};--g${k}:${p[2]};`;dk+=`--c${k}:${PD[k][0]};--h${k}:${PD[k][1]};`;
 cl+=`.p${k}{--pri:var(--c${k});--hi:var(--h${k});--fa:var(--f${k});--fb:var(--g${k})}.p${k} .card{border-left:5px solid var(--c${k})}.cp${k}{border-left:5px solid var(--c${k})!important;--pri:var(--c${k});--hi:var(--h${k})}`});
{const s=document.createElement("style");s.textContent=`:root{${lv}}@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){${dk}}}:root[data-theme="dark"]{${dk}}${cl}`;document.head.appendChild(s)}
let TH="auto";try{TH=localStorage.getItem("rb2t")||"auto"}catch(e){}
const THN={auto:"🌓 ตามเครื่อง",light:"☀️ สว่าง",dark:"🌙 มืด"};
function applyTh(){if(TH==="auto")document.documentElement.removeAttribute("data-theme");else document.documentElement.setAttribute("data-theme",TH);$("thb").textContent=THN[TH]}
function cyc(){TH=TH==="auto"?"light":TH==="light"?"dark":"auto";try{localStorage.setItem("rb2t",TH)}catch(e){}applyTh()}

// ---- state ----
const TD=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const DEF=["เม่า","เตง"],pk=i=>i%6;
const nw=()=>({r:[""],cut:"",advs:[{a:"",n:""}]});
const fresh=(nm,pct)=>({date:TD(),dm:false,price:"",pct:pct==null?40:pct,rnd:false,names:(nm||DEF).slice(),w:(nm||DEF).map(nw)});
const norm=s=>{s.w.forEach(w=>{if(!Array.isArray(w.r)||!w.r.length)w.r=[""];if(!Array.isArray(w.advs))w.advs=[{a:w.adv||"",n:""}];if(!w.advs.length)w.advs=[{a:"",n:""}]});
 if(!Array.isArray(s.names))s.names=[];while(s.names.length<s.w.length)s.names.push("ลูกน้องคนที่ "+(s.names.length+1));s.names.length=s.w.length;return s};
let S=fresh(),H=[],cur=0,cp=0,LP=0,okFn=null;
try{const a=JSON.parse(localStorage.getItem("rb2")||"null");if(a&&Array.isArray(a.w)&&a.w.length>=1)S=norm(a);const h=JSON.parse(localStorage.getItem("rb2h")||"[]");if(Array.isArray(h))H=h;LP=parseFloat(localStorage.getItem("rb2lp"))||0}catch(e){}
if(!S.dm)S.date=TD();
const sv=()=>{try{localStorage.setItem("rb2",JSON.stringify(S))}catch(e){}};
const svh=()=>{try{localStorage.setItem("rb2h",JSON.stringify(H))}catch(e){}};
const $=id=>document.getElementById(id);
const n=v=>parseFloat(v)||0;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const NM=i=>(S.names[i]||"").trim()||"คนที่ "+(i+1);
const f=v=>v.toLocaleString("th-TH",{minimumFractionDigits:2,maximumFractionDigits:2});
const g=v=>v.toLocaleString("th-TH",{maximumFractionDigits:2});
const dTh=d=>{try{return new Date(d).toLocaleDateString("th-TH",{day:"numeric",month:"short",year:"numeric"})}catch(e){return d}};
const sumR=w=>w.r.reduce((a,b)=>a+n(b),0);
const advT=w=>w.advs.reduce((a,x)=>a+n(x.a),0);
const kgOf=w=>sumR(w)-n(w.cut);
const hasP=()=>n(S.price)>0;
const mo=v=>hasP()?f(v):"—";
function calc(w){const kg=kgOf(w),val=kg*n(S.price),pc=Math.min(100,Math.max(0,n(S.pct)));let ws=val*pc/100;if(S.rnd)ws=Math.round(ws);const ad=advT(w);return{kg,val,pc,ws,bs:val-ws,ad,nt:ws-ad}}
function toast(t){const e=$("toast");e.textContent=t;e.className="on";setTimeout(()=>e.className="",1800)}
function ask(t,m,b,fn){$("mt").textContent=t;$("mm").textContent=m;$("mo").textContent=b;okFn=fn;$("md").hidden=false}
function setLP(v){if(n(v)>0){LP=n(v);try{localStorage.setItem("rb2lp",LP)}catch(e){}}}

// ---- nav ----
const T=[["🧑‍🌾","ลูกน้อง"],["💰","ราคา"],["📤","ส่งต่อ"],["🕘","ประวัติ"]];
function navR(){$("nav").innerHTML=T.map((t,i)=>`<button class="${i===cur?"on":""}" ${i===0?`style="--ac:var(--c${pk(cp)})"`:""} onclick="tab(${i})"><span>${t[0]}</span><em>${t[1]}</em></button>`).join("")}
function tab(i){cur=i;for(let k=0;k<4;k++)$("p"+(k+1)).hidden=k!==i;navR();
 if(i===0)rp();if(i===1){if(!S.dm)S.date=TD();$("date").value=S.date;upd2()}if(i===2)r3();if(i===3)r4();scrollTo(0,0)}
function selP(i){cp=i;tab(0)}
function addP(){if(S.w.length>=10){toast("เพิ่มได้สูงสุด 10 คน");return}S.names.push("ลูกน้องคนที่ "+(S.w.length+1));S.w.push(nw());cp=S.w.length-1;sv();build2();tab(0)}
function delP(){ask("ลบ "+NM(cp)+"?","ข้อมูลของคนนี้ในรอบนี้จะถูกลบ","ลบ",()=>{S.w.splice(cp,1);S.names.splice(cp,1);cp=Math.max(0,Math.min(cp,S.w.length-1));sv();build2();tab(0)})}

// ---- person page ----
function rp(){const i=cp,w=S.w[i],k=pk(i);$("p1").className="p"+k;
 $("p1").innerHTML=`<div class="pick">${S.w.map((x,j)=>`<button class="pbtn ${j===i?"on":""}" style="--cc:var(--f${pk(j)})" onclick="selP(${j})"><span class="pa">${AV[pk(j)]}</span><div><b id="pn${j}">${esc(NM(j))}</b><small id="pg${j}">${g(kgOf(x))} กก.</small></div></button>`).join("")}<button class="pbtn add" onclick="addP()">+ เพิ่มคน</button></div>
 <div class="hero"><div class="av">${AV[k]}</div><div style="flex:1;min-width:0"><small>คนที่ ${i+1} จาก ${S.w.length}</small><b id="hn">${esc(NM(i))}</b></div><div style="text-align:right"><small>ได้สุทธิ (บาท)</small><b id="hv"></b></div></div>
 <div class="card"><h2><i>✏️</i>ชื่อ</h2><input value="${esc(S.names[i])}" maxlength="20" placeholder="ใส่ชื่อ" oninput="S.names[${i}]=this.value;sv();$('hn').textContent=NM(${i});$('pn${i}').textContent=NM(${i})"></div>
 <div class="card"><h2><i>⚖️</i>ชั่งน้ำหนัก</h2>
 ${w.r.map((v,j)=>`<div class="row"><input type="number" inputmode="decimal" placeholder="รอบที่ ${j+1} (กก.)" value="${v}" oninput="S.w[${i}].r[${j}]=this.value;updP()">${w.r.length>1?`<button class="x" onclick="S.w[${i}].r.splice(${j},1);sv();rp()">✕</button>`:""}</div>`).join("")}
 <button class="btn o" onclick="S.w[${i}].r.push('');sv();rp()">+ เพิ่มรอบชั่ง</button>
 <div class="sum"><span>รวมที่ชั่ง</span><b id="rs"></b></div>
 <label>หักน้ำหนักที่ยังไม่แห้ง (กก.)</label><input type="number" inputmode="decimal" placeholder="0" value="${w.cut}" oninput="S.w[${i}].cut=this.value;updP()">
 <div class="big"><span>น้ำหนักสุทธิ</span><span id="kg"></span></div></div>
 <div class="card"><h2><i>💰</i>คิดเงิน</h2><div id="ph" class="warn"></div>
 <div class="sum"><span>มูลค่ารวม</span><b id="v"></b></div>
 <div class="sum"><span id="sl"></span><b id="s"></b></div>
 <label>เงินที่เบิกไปก่อน (หักออกจากยอดที่ได้)</label>${w.advs.map((x,j)=>`<div class="row"><input type="number" inputmode="decimal" placeholder="จำนวนเงิน" value="${x.a}" oninput="S.w[${i}].advs[${j}].a=this.value;updP()" style="flex:1.2"><input type="text" placeholder="หมายเหตุ/วันที่" value="${esc(x.n)}" maxlength="30" oninput="S.w[${i}].advs[${j}].n=this.value;sv()" style="flex:1;font-size:16px">${w.advs.length>1?`<button class="x" onclick="S.w[${i}].advs.splice(${j},1);sv();rp()">✕</button>`:""}</div>`).join("")}<button class="btn o" onclick="S.w[${i}].advs.push({a:'',n:''});sv();rp()">+ เพิ่มรายการเบิก</button><div class="sum"><span>รวมเบิก</span><b id="ad"></b></div>
 <div class="big"><span id="tl">ได้สุทธิ</span><span id="t"></span></div>
 <div class="sum"><span id="bl"></span><b id="b"></b></div></div>
 <button class="btn d" onclick="ask('ล้างข้อมูลเริ่มใหม่?','น้ำหนัก ราคา และเงินเบิกจะถูกลบ (รายชื่อและประวัติยังอยู่)','ล้างข้อมูล',doReset)">ล้างข้อมูลเริ่มใหม่</button>
 ${S.w.length>1?`<button class="btn o" style="color:var(--warn);border-color:var(--warn)" onclick="delP()">ลบ ${esc(NM(i))} ออกจากรายชื่อ</button>`:""}`;updP(1)}
function updP(ns){const c=calc(S.w[cp]);$("kg").textContent=g(c.kg)+" กก.";$("rs").textContent=g(sumR(S.w[cp]))+" กก.";$("pg"+cp).textContent=g(c.kg)+" กก.";$("ad").textContent=f(c.ad);
 $("tl").textContent=hasP()&&c.nt<0?"ยอดค้าง (ยกไปรอบหน้า)":"ได้สุทธิ";$("hv").textContent=hasP()?(c.nt<0?"ค้าง ":"")+f(Math.abs(c.nt)):"—";
 $("ph").textContent=hasP()?"":"⚠️ ยังไม่ได้ใส่ราคา (ไปที่แท็บ ราคา)";
 $("v").textContent=mo(c.val);$("sl").textContent="ส่วนแบ่ง "+g(c.pc)+"%";$("s").textContent=mo(c.ws);
 const t=$("t");t.textContent=mo(c.nt);t.className=hasP()&&c.nt<0?"neg":"";$("bl").textContent="ส่วนเถ้าแก่ "+g(100-c.pc)+"%";$("b").textContent=mo(c.bs);sv()}

// ---- price page ----
function build2(){
 $("p2").innerHTML=`<div class="card"><h2><i>💰</i>ราคาและสัดส่วน</h2>
 <label>วันที่ (ตั้งเป็นวันนี้ให้อัตโนมัติ)</label><div class="row"><input id="date" type="date" value="${S.date}" oninput="S.date=this.value;S.dm=true;sv()"><button class="btn o sm" style="width:auto;padding:13px 16px" onclick="S.dm=false;S.date=TD();$('date').value=S.date;sv()">วันนี้</button></div>
 <label>ราคา (บาท/กก.)</label><input id="price" type="number" inputmode="decimal" placeholder="ใส่ราคาวันนี้" value="${S.price}" oninput="S.price=this.value;upd2()">
 <div id="pw" class="warn"></div>
 <label>ลูกน้องได้ (%)</label><input id="pct" type="number" inputmode="decimal" value="${S.pct}" oninput="S.pct=this.value;upd2()">
 <div class="two" style="margin-top:10px"><button class="btn o sm" onclick="setPct(40)">40 : 60</button><button class="btn o sm" onclick="setPct(50)">50 : 50</button></div>
 <label style="display:flex;gap:10px;align-items:center;color:var(--tx);font-size:16px;margin-top:14px"><input type="checkbox" style="width:24px;height:24px" ${S.rnd?"checked":""} onchange="S.rnd=this.checked;upd2()">ปัดส่วนลูกน้องเป็นบาทเต็ม</label></div>`+
 S.w.map((w,i)=>`<div class="card cp${pk(i)}"><h2><i>${AV[pk(i)]}</i><span id="nm${i}"></span></h2>
 <div class="sum"><span>น้ำหนักสุทธิ</span><b id="k${i}"></b></div>
 <div class="sum"><span>มูลค่ารวม</span><b id="v2${i}"></b></div>
 <div class="sum"><span id="sl2${i}"></span><b id="s2${i}"></b></div>
 <div class="sum"><span>หักเงินเบิก</span><b id="a${i}"></b></div>
 <div class="big"><span id="tl2${i}">ได้สุทธิ</span><span id="t2${i}"></span></div>
 <div class="sum"><span id="bl2${i}"></span><b id="b2${i}"></b></div></div>`).join("")+
 `<div class="card"><h2><i>📊</i>สรุปรวม</h2><div class="sum"><span>น้ำหนักรวม</span><b id="tk"></b></div>
 <div class="big"><span>เถ้าแก่ได้</span><span id="tb"></span></div><div class="big"><span>ลูกน้องรวมสุทธิ</span><span id="tw"></span></div>
 <button class="btn" onclick="tab(2)">ไปหน้าส่งต่อ ➜</button></div>
 <button class="btn d" onclick="ask('ล้างข้อมูลเริ่มใหม่?','น้ำหนัก ราคา และเงินเบิกจะถูกลบ (รายชื่อและประวัติยังอยู่)','ล้างข้อมูล',doReset)">ล้างข้อมูลเริ่มใหม่</button>`}
function setPct(v){S.pct=v;$("pct").value=v;upd2()}
function useLP(){S.price=String(LP);$("price").value=LP;upd2()}
function upd2(){let tk=0,tb=0,tw=0;
 $("price").className=hasP()?"":"bad";
 $("pw").innerHTML=hasP()?"":"⚠️ ยังไม่ได้ใส่ราคา"+(LP?` <button class="btn o sm" style="display:inline;width:auto;padding:5px 12px;margin-left:6px" onclick="useLP()">ใช้ราคาล่าสุด ${g(LP)}</button>`:"");
 S.w.forEach((w,i)=>{const c=calc(w);tk+=c.kg;tb+=c.bs;tw+=c.nt;
  $("nm"+i).textContent=NM(i);$("k"+i).textContent=g(c.kg)+" กก.";$("v2"+i).textContent=mo(c.val);$("sl2"+i).textContent="ส่วนแบ่ง "+g(c.pc)+"%";$("s2"+i).textContent=mo(c.ws);
  $("a"+i).textContent=f(c.ad);$("tl2"+i).textContent=hasP()&&c.nt<0?"ยอดค้าง":"ได้สุทธิ";const t=$("t2"+i);t.textContent=mo(c.nt);t.className=hasP()&&c.nt<0?"neg":"";$("bl2"+i).textContent="ส่วนเถ้าแก่ "+g(100-c.pc)+"%";$("b2"+i).textContent=mo(c.bs)});
 $("tk").textContent=g(tk)+" กก.";$("tb").textContent=mo(tb);$("tw").textContent=mo(tw);sv()}
function resetKeep(){const k=S.rnd;setLP(S.price);S=fresh(S.names,S.pct);S.rnd=k;sv();build2()}
function doReset(){resetKeep();tab(cur);toast("ล้างข้อมูลแล้ว")}
function newRound(){const cr=S.w.map(w=>{const c=calc(w);return hasP()&&c.nt<0?-c.nt:0});saveH();resetKeep();cr.forEach((v,i)=>{if(v>0)S.w[i].advs=[{a:String(Math.round(v*100)/100),n:"ยอดค้างยกมา"}]});sv();build2();tab(0);toast("บันทึกแล้ว เริ่มรอบใหม่")}

// ---- export ----
function lines(){
 const pr=n(S.price),pc=Math.min(100,Math.max(0,n(S.pct))),L=[];let tb=0,tw=0,tk=0;
 L.push({t:"สรุปขายขี้ยาง "+dTh(S.date),s:"h"});
 L.push({t:`ราคา ${f(pr)} บาท/กก. | ลูกน้อง ${g(pc)}% : เถ้าแก่ ${g(100-pc)}%`,s:"g"});
 S.w.forEach((w,i)=>{const rs=w.r.filter(x=>x!=="").map(n),c=calc(w);tb+=c.bs;tw+=c.nt;tk+=c.kg;
  L.push({t:"",s:"n"});L.push({t:"● "+NM(i),s:"b"});
  L.push({t:`1) ชั่ง ${rs.length>1?rs.map(g).join(" + ")+" = "+g(sumR(w)):g(sumR(w))} กก.`,s:"n"});
  if(n(w.cut))L.push({t:`2) หักชื้น ${g(n(w.cut))} → เหลือ ${g(c.kg)} กก.`,s:"n"});
  L.push({t:`3) ${g(c.kg)} × ${f(pr)} = ${f(c.val)} บาท`,s:"n"});
  L.push({t:`4) ลูกน้อง ${g(pc)}% = ${f(c.ws)} บาท`,s:"n"});
  if(c.ad){const it=w.advs.filter(x=>n(x.a));if(it.length>1){L.push({t:"5) หักเงินเบิก",s:"n"});it.forEach(x=>L.push({t:`    - ${f(n(x.a))}${x.n?" ("+x.n+")":""}`,s:"g"}));L.push({t:`    รวมเบิก ${f(c.ad)} บาท`,s:"n"})}else L.push({t:`5) หักเงินเบิก ${f(c.ad)} บาท${it[0]&&it[0].n?" ("+it[0].n+")":""}`,s:"n"})}
  L.push({t:c.nt<0?`➜ ${NM(i)} ยอดค้าง ${f(-c.nt)} บาท (ยกไปรอบหน้า)`:`➜ ${NM(i)} ได้สุทธิ ${f(c.nt)} บาท`,s:"b"});
  L.push({t:`   (เถ้าแก่ ${g(100-pc)}% = ${f(c.bs)} บาท)`,s:"g"})});
 L.push({t:"",s:"n"});L.push({t:`รวม ${g(tk)} กก.`,s:"n"});
 L.push({t:`เถ้าแก่ได้ ${f(tb)} บาท`,s:"b"});L.push({t:`ลูกน้องรวมสุทธิ ${f(tw)} บาท`,s:"b"});return L}
const txt=()=>lines().map(l=>l.t).join("\n");
function cv(L){const W2=720,LH=38,H2=100+L.length*LH+24,c=document.createElement("canvas");c.width=W2*2;c.height=H2*2;const x=c.getContext("2d");x.scale(2,2);
 x.fillStyle="#fff";x.fillRect(0,0,W2,H2);const gr=x.createLinearGradient(0,0,W2,0);gr.addColorStop(0,"#2f7d57");gr.addColorStop(1,"#418f6b");x.fillStyle=gr;x.fillRect(0,0,W2,70);
 const ff='"Sarabun","Noto Sans Thai",sans-serif';x.fillStyle="#fff";x.font="bold 30px "+ff;x.fillText(L[0].t,24,46);
 L.slice(1).forEach((l,k)=>{const y=70+36+k*LH;x.font=(l.s==="b"?"bold 26px ":"24px ")+ff;x.fillStyle=l.s==="g"?"#6b776b":l.s==="b"?"#2f7d57":"#222";x.fillText(l.t,24,y)});
 return c}
const img=L=>cv(L).toDataURL("image/png");
function shImg(){cv(lines()).toBlob(async b=>{try{const fl=new File([b],"ขี้ยาง-"+S.date+".png",{type:"image/png"});if(navigator.canShare&&navigator.canShare({files:[fl]}))await navigator.share({files:[fl]});else toast("กดค้างที่รูปเพื่อบันทึก")}catch(e){}})}
function r3(){const L=lines();
 $("p3").innerHTML=(hasP()?"":`<div class="card"><div class="warn" style="margin:0">⚠️ ยังไม่ได้ใส่ราคา — ไปแท็บ "ราคา" ก่อนส่ง</div></div>`)+`<div class="card"><h2><i>🖼️</i>รูปสรุป</h2><img id="im" alt="สรุป"><div class="hint">กดค้างที่รูป → บันทึก/คัดลอก แล้วส่งเข้าไลน์</div></div>
 <div class="card"><h2><i>📝</i>ข้อความ + วิธีคิด</h2><textarea id="tx" readonly>${esc(txt())}</textarea>
 <button class="btn" onclick="shImg()">🖼️ แชร์รูปเข้าไลน์</button><button class="btn o" onclick="cp2()">คัดลอกข้อความ</button><button class="btn o" onclick="sh()">แชร์ข้อความไปไลน์/แอปอื่น</button>
 <button class="btn o" onclick="saveH();toast('บันทึกแล้ว')">💾 บันทึกลงประวัติ</button><button class="btn o" onclick="newRound()">✅ บันทึก + เริ่มรอบใหม่</button></div>`;
 try{$("im").src=img(L)}catch(e){}}
function cp2(){const t=$("tx");t.focus();t.select();let ok=false;
 try{navigator.clipboard.writeText(txt()).then(()=>toast("คัดลอกแล้ว"),()=>{try{document.execCommand("copy")&&toast("คัดลอกแล้ว")}catch(e){}});ok=true}catch(e){}
 if(!ok){try{document.execCommand("copy");toast("คัดลอกแล้ว")}catch(e){toast("กดค้างที่ข้อความเพื่อคัดลอก")}}}
async function sh(){try{await navigator.share({text:txt()})}catch(e){cp2()}}
function saveH(){let tb=0;const nets=S.w.map(w=>{const c=calc(w);tb+=c.bs;return c.nt});setLP(S.price);
 H.unshift({id:Date.now(),date:S.date,tb,nets,price:S.price,s:JSON.parse(JSON.stringify(S))});H=H.slice(0,100);svh()}

// ---- history / backup ----
function r4(){$("p4").innerHTML=`<div class="card"><h2><i>🕘</i>ประวัติ</h2>`+(H.length?H.map(h=>`<div class="hist"><div><b>${dTh(h.date)}</b><div class="hint" style="margin:0">ราคา ${g(n(h.price))} | ${esc((h.s.names||DEF).map((x,k)=>x+" "+(h.nets&&h.nets[k]!=null?f(h.nets[k]):"")).join(" | "))}</div></div><div class="two"><button class="btn o sm" onclick="ld(${h.id})">เปิด</button><button class="btn d sm" onclick="dl(${h.id})">ลบ</button></div></div>`).join(""):`<div class="hint">ยังไม่มีรายการ — บันทึกจากหน้า "ส่งต่อ"</div>`)+`</div>
 <div class="card"><h2><i>🛟</i>สำรอง / กู้คืนข้อมูล</h2><div class="hint">คัดลอกเก็บไว้ (เช่น ส่งเข้าไลน์ตัวเอง) แล้ววางกู้คืนเมื่อเปลี่ยนเครื่อง</div>
 <textarea id="bk" style="height:90px" placeholder="วางข้อมูลสำรองที่นี่"></textarea><div class="two" style="margin-top:8px"><button class="btn o sm" onclick="backup()">คัดลอกสำรอง</button><button class="btn o sm" onclick="restore()">กู้คืน</button></div></div>`}
function ld(id){const h=H.find(x=>x.id===id);if(h){S=norm(JSON.parse(JSON.stringify(h.s)));cp=0;sv();build2();tab(1);toast("เปิดรายการแล้ว")}}
function dl(id){H=H.filter(x=>x.id!==id);svh();r4()}
function backup(){const t=JSON.stringify({v:3,S,H}),e=$("bk");e.value=t;e.focus();e.select();try{navigator.clipboard.writeText(t).then(()=>toast("คัดลอกข้อมูลสำรองแล้ว"),()=>{try{document.execCommand("copy");toast("คัดลอกแล้ว")}catch(x){}})}catch(x){try{document.execCommand("copy");toast("คัดลอกแล้ว")}catch(y){}}}
function restore(){try{const o=JSON.parse($("bk").value);if(o&&o.S&&Array.isArray(o.S.w)&&o.S.w.length>=1){S=norm(o.S);if(Array.isArray(o.H))H=o.H;cp=0;sv();svh();build2();r4();toast("กู้คืนแล้ว")}else toast("ข้อมูลไม่ถูกต้อง")}catch(e){toast("ข้อมูลไม่ถูกต้อง")}}

applyTh();build2();tab(0);
try{if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
</script></body></html>
